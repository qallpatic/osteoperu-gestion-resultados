<div class="login">
  <!-- Panel de marca -->
  <aside class="brand">
    <div class="brand__blob brand__blob--a"></div>
    <div class="brand__blob brand__blob--b"></div>

    <img src="assets/logo_osteo_white.png" alt="OsteoPerú" class="brand__logo" />

    <div class="brand__copy">
      <p>Portal de envío de resultados. Comparte de forma segura los estudios de tus pacientes.</p>
      <ul class="brand__features">
        <li><i class="fas fa-file-pdf"></i><span>PDF</span></li>
        <li><i class="fas fa-video"></i><span>Videos</span></li>
        <li><i class="fas fa-shield-halved"></i><span>Seguro</span></li>
      </ul>
    </div>
  </aside>

  <!-- Panel de formulario -->
  <main class="panel">
    <form class="card" (ngSubmit)="submit()" #f="ngForm" novalidate>
      <header class="card__head">
        <h1>Iniciar sesión</h1>
        <p>Ingresa tus credenciales para continuar</p>
      </header>

      @if (error()) {
        <div class="alert" role="alert">
          <i class="fas fa-circle-exclamation"></i>
          <span>{{ error() }}</span>
        </div>
      }

      <div class="field">
        <label for="user">Usuario</label>
        <div class="control">
          <i class="fas fa-user"></i>
          <input id="user" name="user" type="text" autocomplete="username"
                 placeholder="Usuario" [(ngModel)]="user" required />
        </div>
      </div>

      <div class="field">
        <label for="pass">Contraseña</label>
        <div class="control">
          <i class="fas fa-lock"></i>
          <input id="pass" name="pass" [type]="showPassword() ? 'text' : 'password'"
                 autocomplete="current-password" placeholder="••••••••"
                 [(ngModel)]="password" required />
          <button type="button" class="toggle" (click)="showPassword.set(!showPassword())"
                  [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <i class="fas" [class.fa-eye]="!showPassword()" [class.fa-eye-slash]="showPassword()"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn" [disabled]="f.invalid">
        <i class="fas fa-right-to-bracket"></i>
        Ingresar
      </button>
    </form>

    <p class="foot">QALLPATIC &copy; 2026 — Sistema de resultados</p>
  </main>
</div>
