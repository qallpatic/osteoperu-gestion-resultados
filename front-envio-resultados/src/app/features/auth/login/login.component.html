<div class="login">
  <!-- Panel de marca -->
  <aside class="brand">
    <div class="brand__blob brand__blob--a"></div>
    <div class="brand__blob brand__blob--b"></div>

    <img src="assets/logo_osteo_white.png" alt="OsteoPerú" class="brand__logo" />

    <div class="brand__copy">
      <p>Plataforma de resultados médicos. Gestiona de forma segura los estudios de tus pacientes.</p>
      <ul class="brand__features">
        <li><i class="fas fa-file-pdf"></i><span>Resultados</span></li>
        <li><i class="fas fa-user-shield"></i><span>Acceso por rol</span></li>
        <li><i class="fas fa-shield-halved"></i><span>Seguro</span></li>
      </ul>
    </div>
  </aside>

  <!-- Panel de formulario -->
  <main class="panel">
    <form class="card" (ngSubmit)="submit()" #f="ngForm" novalidate>
      <header class="card__head">
        <h1>Iniciar sesión</h1>
        <p>Ingresa tus credenciales para continuar</p>
      </header>

      @if (error()) {
        <div class="alert" role="alert">
          <i class="fas fa-circle-exclamation"></i>
          <span>{{ error() }}</span>
        </div>
      }

      <div class="field">
        <label for="usuario">Usuario</label>
        <div class="control">
          <i class="fas fa-user"></i>
          <input id="usuario" name="usuario" type="text" autocomplete="username"
                 placeholder="Usuario" [(ngModel)]="usuario" required />
        </div>
      </div>

      <div class="field">
        <label for="pass">Contraseña</label>
        <div class="control">
          <i class="fas fa-lock"></i>
          <input id="pass" name="pass" [type]="showPassword() ? 'text' : 'password'"
                 autocomplete="current-password" placeholder="••••••••"
                 [(ngModel)]="contrasena" required />
          <button type="button" class="toggle" (click)="showPassword.set(!showPassword())"
                  [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <i class="fas" [class.fa-eye]="!showPassword()" [class.fa-eye-slash]="showPassword()"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn" [disabled]="f.invalid || cargando()">
        <i class="fas" [class.fa-right-to-bracket]="!cargando()"
           [class.fa-spinner]="cargando()" [class.fa-spin]="cargando()"></i>
        {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p class="foot">QALLPATIC &copy; 2026 — Sistema de resultados</p>
  </main>
</div>
