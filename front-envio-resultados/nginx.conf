server {
    listen 80;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Permite subir archivos grandes (resultados: PDF/imagen/video).
    client_max_body_size 300m;

    # Compresion para los assets estaticos
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ===============================================================
    # Soporte para el sub-path /resultados/ (Angular base-href)
    # ===============================================================
    # El frontend se compila con `--base-href=/resultados/`, por lo que el
    # navegador resuelve todos los assets relativos bajo ese prefijo.
    #
    # En PRODUCCION, Nginx Proxy Manager hace strip del prefijo antes de
    # pasar al contenedor, por lo que llega `/chunk-XXX.js` y el `location /`
    # de abajo lo sirve directo.
    #
    # En DEV LOCAL (sin NPM), llega `/resultados/chunk-XXX.js` y este bloque
    # `location ^~ /resultados/` lo reescribe via `alias` contra la raiz del
    # docroot, donde Angular realmente guarda los assets.
    #
    # El `^~` es importante: evita que la location regex de cache de abajo
    # intercepte los assets y devuelva 404.

    # ---- API: cuando se llama bajo /resultados/ (local dev) ----
    location ^~ /resultados/osteoperu-api-resultados/ {
        # Quita el /resultados/ para mantener el CONTEXT_PATH del backend.
        rewrite ^/resultados(/.*)$ $1 break;
        proxy_pass http://backend:7090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- SPA: archivos y rutas del frontend bajo /resultados/ ----
    location ^~ /resultados/ {
        alias /usr/share/nginx/html/;
        index index.html;

        # Cache larga para assets con hash de Angular
        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA: rutas desconocidas (Angular Router) caen en index.html
        try_files $uri $uri/ /index.html;
    }

    # ===============================================================
    # Acceso SIN sub-path (NPM ya strippeo el prefijo en prod)
    # ===============================================================

    # ---- API: cuando NPM ya quito /resultados/ ----
    location /osteoperu-api-resultados/ {
        proxy_pass http://backend:7090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Cache larga para los assets con hash de Angular
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida cae en index.html (Angular Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
