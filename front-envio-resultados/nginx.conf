server {
    listen 80;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Permite subir archivos grandes (resultados: PDF/imagen/video).
    client_max_body_size 300m;

    # Compresion para los assets estaticos
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API / visor / acortador del backend (mismo origen) ----
    # Todo lo que cuelga de /back-envio-resultados-api/ se redirige al backend.
    location /osteoperu-api-resultados/ {
        proxy_pass http://backend:7090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Cache larga para los assets con hash de Angular
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida cae en index.html (Angular Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
