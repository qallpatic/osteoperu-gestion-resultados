# ============================================================
#  OSTEOPERU - Resultados  |  Despliegue Docker parametrizado
#  ------------------------------------------------------------
#  Por defecto levanta el perfil DEV con .env.dev.
#  Para PROD usar docker-compose.prod.yml (ver DEPLOY.md).
#
#  Comandos rapidos:
#    dev:  ./scripts/dev-up.sh  |  docker compose up -d --build
#    prod: ./scripts/prod-up.sh
# ============================================================

services:
  backend:
    build: ./back-envio-resultados-api
    image: osteoperu/back-resultados:${TAG:-latest}
    container_name: osteoperu-backend
    restart: unless-stopped
    # Mapeo del puerto al host. En prod se quita via docker-compose.prod.yml
    # (el backend queda accesible solo desde osteoperu-frontend dentro de la red).
    ports:
      - "${BACKEND_PORT:-7090}:7090"
    env_file:
      - ${ENV_FILE:-.env.dev}
    environment:
      # Valores fijos / derivados que aplican a ambos entornos. Las variables
      # sensibles (DB_PASSWORD, JWT_SECRET, RENIEC_TOKEN, STORAGE_S3_SECRET_KEY, ...)
      # vienen del env_file. NO pisar ahi STORAGE_* con defaults vacios porque
      # el bloque environment tiene prioridad sobre env_file.
      # Zona horaria del JVM: America/Lima (UTC-5, Peru). Sobre-escribible con
      # la variable TZ en .env.dev / .env.prod sin rebuildear la imagen.
      TZ: ${TZ:-America/Lima}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      CONTEXT_PATH: ${CONTEXT_PATH:-/osteoperu-api-resultados}
      STORAGE_BASE_PATH: /app/uploads
      SERVER_PORT: 7090
    volumes:
      - ${UPLOADS_PATH:-./uploads}:/app/uploads
    # Limites de recursos para DEV (sin trafico real). Mitad aprox del PROD
    # (3G/2cpus) para que convivan sin pelearse en el host de 32 GB.
    # JVM calcula heap como ~25% del limit (~384 MB), alcanza para dev.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 768M
    networks:
      - osteoperu-net
      - proxy-network

  frontend:
    # Se compila desde el codigo fuente directo del repo (no requiere
    # staging previo en el host: el Dockerfile del front hace el npm install
    # y el ng build dentro de su propio multi-stage).
    build: ./front-envio-resultados
    image: osteoperu/front-resultados:${TAG:-latest}
    container_name: osteoperu-frontend
    restart: unless-stopped
    # Acceso directo sin NPM: http://localhost:6060/resultados/
    # Acceso por subdominio: https://osteoperu-dev.qallpatic.com/resultados/ (via NPM)
    ports:
      - "${FRONTEND_PORT:-6060}:80"
    depends_on:
      - backend
    # Nginx sirviendo estaticos + proxy al backend: 192 MB es mas que suficiente
    # para dev (mitad del PROD). CPU acotada para no robar al backend.
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
        reservations:
          cpus: '0.1'
          memory: 48M
    networks:
      - osteoperu-net
      - proxy-network

networks:
  osteoperu-net:
    driver: bridge
  proxy-network:
    external: true
    name: proxy-network