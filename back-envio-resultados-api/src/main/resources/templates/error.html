<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<meta name="robots" content="noindex, nofollow"/>
	<title>Enlace no disponible — OSTEOPERU</title>
	<style>
		body {
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			background: #f1f5f4; color: #1f2937;
			display: flex; min-height: 100vh; align-items: center; justify-content: center;
			margin: 0; padding: 20px;
		}
		.card {
			background: #fff; border-radius: 16px; padding: 40px 32px;
			box-shadow: 0 10px 30px rgba(15,118,110,.12);
			max-width: 420px; text-align: center;
		}
		.icon { font-size: 3rem; }
		h1 { color: #115e59; margin: 12px 0 8px; font-size: 1.3rem; }
		p { color: #6b7280; font-size: .95rem; }
	</style>
</head>
<body>
<div class="card">
	<div class="icon">🔒</div>
	<h1>Enlace no disponible</h1>
	<p th:text="${mensaje} ?: 'El enlace no existe o ha expirado. Comunícate con OSTEOPERU para obtener uno nuevo.'">
		El enlace no existe o ha expirado.
	</p>
</div>
</body>
</html>
