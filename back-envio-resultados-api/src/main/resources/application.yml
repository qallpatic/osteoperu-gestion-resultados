# ============================================================
#  Configuracion base (comun a todos los ambientes).
#  El ambiente se selecciona con SPRING_PROFILES_ACTIVE
#  (local | server). Por defecto: local.
# ============================================================
spring:
  application:
    name: back-envio-resultados-api
  profiles:
    active: server
  # --- JPA / Hibernate: el esquema lo gobierna Flyway, no Hibernate ---
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      # Respeta los nombres de tabla/columna tal cual (MAYUSCULAS). La estrategia
      # por defecto de Spring los pasa a minusculas y rompe en MySQL case-sensitive.
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  # --- Flyway: migraciones versionadas ---
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # El historial de Flyway tiene checksums desalineados porque V11
    # se renombro a V12 en una intervencion manual. validate-off +
    # repair-on-migrate deja a Flyway auto-corregir el checksum en cada
    # arranque sin que sea necesario tocar la BD. Mantener hasta que se
    # limpie la BD o se migre a una plataforma con migracion limpia.
    validate-on-migrate: false
    repair-on-migrate: true

  # --- Limites de subida de archivos ---
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:50MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:250MB}

server:
  port: ${SERVER_PORT:7090}
  servlet:
    context-path: ${CONTEXT_PATH:/back-envio-resultados-api}
  forward-headers-strategy: native

# ------------------------------------------------------------
#  Parametros de negocio (sin hardcodear en el codigo)
# ------------------------------------------------------------
app:
  # Usuario del panel de carga (Basic Auth). OBSOLETO tras la Fase 5 (JWT); se
  # mantiene por compatibilidad hasta retirar cualquier referencia.
  security:
    username: ${PANEL_USER:osteoperu}
    password: ${PANEL_PASSWORD:Osteoperu@2026}
  # URL publica base con la que se arma el link que va en el SMS.
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:7090/back-envio-resultados-api}
  # URL del portal del paciente (destino del QR de la credencial de Admision).
  portal-url: ${PORTAL_URL:http://localhost:4200/login}
  # API gratuita/ilimitada para generar el QR (goqr.me).
  qr:
    base-url: ${QR_BASE_URL:https://api.qrserver.com/v1/create-qr-code/}
  # Origenes del front autorizados a consumir la API (CORS). Lista separada por comas.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # Prefijo de codigo de pais para normalizar el numero destino.
  phone:
    country-code: "51"
  shortlink:
    code-length: 7
    # dias de validez del link enviado por SMS (0 = sin expiracion)
    ttl-days: 0
  # Telefono al que el front muestra cuando un flujo publico no puede continuar
  # (ej. recuperar password). Sobreescribible por SOPORTE_TELEFONO.
  soporte:
    telefono: ${SOPORTE_TELEFONO:080012346}

# ------------------------------------------------------------
#  Almacenamiento de resultados (se sobreescribe por ambiente)
#  storage.type: "local" (FS del contenedor) o "s3" (MinIO/S3-compatible)
# ------------------------------------------------------------
storage:
  type: ${STORAGE_TYPE:local}
  base-path: ${STORAGE_BASE_PATH:./data/resultados}
  allowed-content-types: >-
    application/pdf,
    image/jpeg, image/png, image/webp, image/gif,
    video/mp4, video/quicktime, video/webm
  s3:
    endpoint: ${STORAGE_S3_ENDPOINT:}
    region: ${STORAGE_S3_REGION:us-east-1}
    access-key: ${STORAGE_S3_ACCESS_KEY:}
    secret-key: ${STORAGE_S3_SECRET_KEY:}
    bucket: ${STORAGE_S3_BUCKET:}
    force-path-style: ${STORAGE_S3_FORCE_PATH_STYLE:true}
    presign-minutes: ${STORAGE_S3_PRESIGN_MINUTES:10}

# ------------------------------------------------------------
#  Gateway SMS (Textbee) - mismo mecanismo del proyecto base
# ------------------------------------------------------------
sms:
  enabled: ${SMS_ENABLED:false}
  textbee:
    url: ${SMS_GATEWAY_URL:http://161.132.53.229:3001/api/v1/gateway/devices/69b88ed724a851efe4c5a68f/send-sms}
    api-key: ${SMS_API_KEY:576f18ae-07f5-4102-968b-57ac26f5f6dc}
    frequency-ms: ${SMS_FREQUENCY_MS:5000}
  message:
    # Link al login del operador (reutiliza PORTAL_URL, configurable via .env).
    login-url: ${SMS_LOGIN_URL:${PORTAL_URL:http://localhost:6060/login}}
    # Plantillas multi-linea (los saltos se ven como enter en el telefono).
    # {nombre} = nombre del paciente, {link} = login-url, {usuario} {clave} = credenciales.
    template: |
      OSTEOPERU

      Hola {nombre},

      Tus resultados medicos ya estan disponibles.
      Ingresa al portal: {link}

      Servicio de atencion al paciente.
    credencial-template: |
      OSTEOPERU

      Hola {nombre},

      Ya tienes acceso a tus resultados.

      Usuario: {usuario}
      Clave: {clave}

      Ingresa al portal: {link}

      Servicio de atencion al paciente.
    recuperacion-template: |
      OSTEOPERU

      Hola {nombre},

      DNI: {dni}

      Tu nueva clave de acceso es:

      {clave}

      Por seguridad te recomendamos cambiarla al ingresar.

      Ingresa al portal: {link}

      Servicio de atencion al paciente.

# ------------------------------------------------------------
#  Seguridad JWT y semilla del usuario ADMIN inicial
# ------------------------------------------------------------
seguridad:
  jwt:
    # Clave HS256 (minimo 32 bytes). En produccion SIEMPRE via variable de entorno.
    secret: ${JWT_SECRET:osteoperu-cambia-esta-clave-secreta-jwt-hs256-minimo-32-bytes-2026}
    # Duracion del access token (4 horas para soportar jornadas de carga continuas)
    # y del refresh token (7 dias), en milisegundos.
    access-expiration-ms: ${JWT_ACCESS_MS:14400000}
    refresh-expiration-ms: ${JWT_REFRESH_MS:604800000}
    issuer: osteoperu
  # Usuario ADMIN que se crea al arrancar si aun no existe (idempotente).
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin@2026}
    nombre: ${ADMIN_NOMBRE:Administrador}

# ------------------------------------------------------------
#  Integracion RENIEC (validacion DNI -> nombre)
#  enabled=false -> modo mock (sin proveedor real).
#  Proveedor actual: apiperu.dev (POST con JSON {"dni": "..."}).
#  En .env.prod/.env.dev se sobreescriben RENIEC_URL y RENIEC_TOKEN.
#  Cuando cambie el proveedor, actualizar el campo url, el token y la
#  estructura de respuesta en ClienteReniecHttp.
# ------------------------------------------------------------
reniec:
  enabled: ${RENIEC_ENABLED:true}
  url: ${RENIEC_URL:https://apiperu.dev/api/dni}
  # En produccion sobrescribir SIEMPRE via RENIEC_TOKEN (no usar este default).
  token: ${RENIEC_TOKEN:}
  timeout-ms: ${RENIEC_TIMEOUT_MS:6000}
  # TTL del cache local RENIEC_CACHE (dias). Por defecto medio ano: 180.
  cache-dias: ${RENIEC_CACHE_DIAS:180}

# ------------------------------------------------------------
#  Rate-limit del endpoint /api/auth/recuperar-password
#  Persiste en INTENTO_RECUPERACION_PASSWORD (ver V9).
#  Cada var puede sobreescribirse via .env (dev/prod).
# ------------------------------------------------------------
recuperacion:
  longitud-clave: ${RECUPERACION_LONGITUD_CLAVE:6}
  max-intentos-ip: ${RECUPERACION_MAX_INTENTOS_IP:3}
  max-intentos-telefono: ${RECUPERACION_MAX_INTENTOS_TELEFONO:3}
  max-distintos-por-ip: ${RECUPERACION_MAX_DISTINTOS_POR_IP:3}
  ventana-minutos: ${RECUPERACION_VENTANA_MINUTOS:10}
  retention-horas: ${RECUPERACION_RETENCION_HORAS:24}
  limpieza-cron: "0 0 * * * *"

# ------------------------------------------------------------
#  Rate-limit del endpoint /api/auth/login
#  Persiste en INTENTO_LOGIN (ver V10). 5/IP+usuario y 5/usuario en 10 min.
# ------------------------------------------------------------
login:
  max-intentos-ip: ${LOGIN_MAX_INTENTOS_IP:5}
  max-intentos-usuario: ${LOGIN_MAX_INTENTOS_USUARIO:5}
  ventana-minutos: ${LOGIN_VENTANA_MINUTOS:10}
  retention-horas: ${LOGIN_RETENCION_HORAS:24}
  limpieza-cron: "0 0 * * * *"

# ------------------------------------------------------------
#  Google reCAPTCHA v3 - proteccion contra bots en /api/auth/login
#  enabled=false  -> el endpoint sigue funcionando como antes (sin captcha)
#  enabled=true   -> el front carga el script y envia recaptchaToken; el back
#                    valida con siteverify y rechaza si score < minScore o si
#                    no llega token (HTTP 403).
#  Las claves se sobreescriben via .env: RECAPTCHA_ENABLED / RECAPTCHA_SITE_KEY / RECAPTCHA_SECRET_KEY
# ------------------------------------------------------------
recaptcha:
  enabled: ${RECAPTCHA_ENABLED:false}
  site-key: ${RECAPTCHA_SITE_KEY:}
  secret-key: ${RECAPTCHA_SECRET_KEY:}
  verify-url: "https://www.google.com/recaptcha/api/siteverify"
  min-score: ${RECAPTCHA_MIN_SCORE:0.5}
  timeout-ms: ${RECAPTCHA_TIMEOUT_MS:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    pe.com.qallpatic.osteoperu: DEBUG
    org.flywaydb: INFO
    org.apache.pdfbox.pdmodel.font: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36}.%M:%L - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
